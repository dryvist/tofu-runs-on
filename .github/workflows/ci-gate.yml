name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Markdown lint, file size, fmt/init/validate/tflint (`tofu_ci`) and the OSV
  # differential scan via the org reusable gate. The local `gate` job keeps
  # the bare `Merge Gate` context this repo's ruleset requires.
  shared-gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # actions: write must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
    with:
      tofu_ci: true
      osv_scan: true
      filters: |
        markdown:
          - '**.md'
          - '.markdownlint*'
        terraform:
          - '**.tf'
          - '**.tfvars'
          - '.terraform.lock.hcl'
          - '.tflint.hcl'

  gate:
    name: Merge Gate
    needs: [shared-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
